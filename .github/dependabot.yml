version: 2
updates:
  # Actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Julia packages in Project.toml
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
